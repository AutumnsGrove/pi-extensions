name: ci

# The gates pi-review is not: a review reads code, it does not compile it. #51
# found the difference the hard way — the repo declared `^1.3.0` for the host
# packages while the extensions already used 1.5 APIs, so a clean clone
# typechecked against types nobody had and everyone's local `node_modules` hid
# it. `--frozen-lockfile` is the point of this workflow: it fails when the
# lockfile and `package.json` disagree, instead of resolving whatever is newest.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The same image pi-review pins, for the same reason: this is the gate
    # contributors compare against, so it should not move under them when
    # GitHub rotates the `ubuntu-latest` label.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # `engines` asks for >=22.19.0; the lockfile knows nothing about node, so
      # the version has to be named here or the runner's default decides.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # `packageManager` in package.json pins pnpm 10.32.1, and corepack is what
      # reads it, so the CI version cannot drift from the one that wrote the
      # lockfile. No pnpm cache: the install is short, and a cache keyed on a
      # store this workflow does not own is one more thing that can go stale.
      - name: Enable the pinned package manager
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      # Two checked-in generated files. Neither needs the network, and both are
      # the kind of drift a reviewer should not have to spot: the theme output
      # regenerates from `themes/`, and the pi-review caller must match
      # `.github/pi-review.json` and the reusable workflow it points at.
      - name: Themes are regenerated
        run: pnpm themes:check

      - name: pi-review callers are in sync
        run: pnpm pi-review:sync --check
