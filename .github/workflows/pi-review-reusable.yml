name: pi-review

# The job body for every project that installs pi-review. Each project commits a
# small caller that points here at @main, so a fix in this file reaches every
# project without a commit there. The settings stay in the caller's
# `.github/pi-review.json` and are read at run time, so model, provider, tools,
# triggers and timeout remain local to each project.
#
# This file is the source, not generated. The caller is generated by
# `extensions/pi-review/workflow.ts` and checked by `pnpm pi-review:sync --check`.
#
# Runs from the caller's own event: `github.repository` is the caller, the
# checkout is the caller's PR, and the extension source is fetched at the commit
# of this file (`job.workflow_sha`) so the review runs the code that
# defined the job.

on:
  workflow_call:
    inputs:
      settings-path:
        description: Where the caller keeps its pi-review settings.
        type: string
        default: .github/pi-review.json
      review-timeout-minutes:
        description: Time allowed for the review step.
        type: number
        default: 20
      job-timeout-minutes:
        description: Time allowed for the whole job, review included.
        type: number
        default: 33
      install-dependencies:
        description: Install the caller's dependencies before reviewing.
        type: boolean
        default: true
      install-command:
        description: A custom install command, used instead of lockfile detection.
        type: string
        default: ""
    secrets:
      PI_REVIEW_API_KEY:
        required: false
      PI_REVIEW_APP_ID:
        required: false
      PI_REVIEW_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Pinned, not `ubuntu-latest`: the label migrates to Ubuntu 26 in
    # November 2026, and a reviewer should not change operating system under a
    # pull request because GitHub rotated a label.
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    env:
      # A step's `if:` cannot read `secrets`, so the presence of both App secrets
      # is decided once here. Without it the mint step is unconditional, and a
      # repository with the App identity but no secrets fails before the review
      # step's `github.token` fallback can be reached.
      PI_REVIEW_APP_CONFIGURED: ${{ secrets.PI_REVIEW_APP_ID != '' && secrets.PI_REVIEW_APP_PRIVATE_KEY != '' }}
      PI_REVIEW_SETTINGS: ${{ inputs.settings-path }}
    steps:
      # The guard needs only `gh pr view`, so it runs before anything touches the
      # PR's tree: no checkout, no cache restore, no install. A mention on a fork
      # PR cannot execute that fork's install scripts or poison the dependency
      # cache that trusted runs restore (#33).
      - name: Require a same-repo pull request
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          head=$(gh pr view "$PR_NUMBER" --json headRepository --jq '.headRepository.nameWithOwner')
          if [ "$head" != "${{ github.repository }}" ]; then
            echo "::error::pi-review only reviews pull requests from this repository"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check the settings file
        run: |
          set -euo pipefail
          if [ ! -f "$PI_REVIEW_SETTINGS" ]; then
            echo "::error::$PI_REVIEW_SETTINGS is missing; run /pi-review install in this repository"
            exit 1
          fi
          if ! jq -e . "$PI_REVIEW_SETTINGS" > /dev/null; then
            echo "::error::$PI_REVIEW_SETTINGS is not valid JSON"
            exit 1
          fi

      # No secret reaches this step. The install runs the caller's own scripts,
      # which is why it is bounded, allowed to fail, and kept away from keys.
      #
      # There is deliberately no `actions/cache` here. Saving a cache needs
      # `actions: write`, and a reusable workflow can only use permissions its
      # caller granted; adding that would mean regenerating every project's
      # caller, which is the toil this design exists to remove (#34). The cache
      # never saved under the old permissions either, so this is the same speed
      # it always had, minus a restore that could never hit. If caching is worth
      # the per-project permission later, add `actions: write` to the caller and
      # the cache back here together.
      - name: Install dependencies
        if: inputs.install-dependencies
        id: deps
        continue-on-error: true
        timeout-minutes: 8
        env:
          PI_REVIEW_INSTALL_COMMAND: ${{ inputs.install-command }}
        run: |
          set -uo pipefail
          echo "PI_REVIEW_DEPS=unavailable" >> "$GITHUB_ENV"
          if [ -n "$PI_REVIEW_INSTALL_COMMAND" ]; then
            if eval "$PI_REVIEW_INSTALL_COMMAND"; then
              echo "PI_REVIEW_DEPS=installed" >> "$GITHUB_ENV"
            else
              echo "::warning::The configured install command failed; the reviewer will be told tests may not run."
              exit 1
            fi
            exit 0
          fi
          failed=0
          found=0
          run() { if ! "$@"; then failed=1; fi; }
          # Node managers are mutually exclusive: running two of them leaves the
          # tree from whichever ran last (npm ci deletes node_modules).
          if [ -f pnpm-lock.yaml ]; then
            found=1; run corepack pnpm install --frozen-lockfile --prefer-offline
          elif [ -f package-lock.json ]; then
            found=1; run npm ci --prefer-offline --no-audit --no-fund
          elif [ -f yarn.lock ]; then
            found=1
            if corepack yarn --version | grep -q '^1\.'; then
              run corepack yarn install --frozen-lockfile
            else
              run corepack yarn install --immutable
            fi
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then
            found=1; run npm install -g bun; run bun install --frozen-lockfile
          fi
          if [ -f uv.lock ]; then
            found=1
            if ! command -v uv >/dev/null 2>&1; then curl -LsSf https://astral.sh/uv/install.sh | sh; export PATH="$HOME/.local/bin:$PATH"; fi
            run uv sync --frozen
          fi
          if [ -f poetry.lock ]; then found=1; run python3 -m pip install --user --quiet poetry; run poetry install --no-interaction; fi
          if [ -f Pipfile.lock ]; then found=1; run python3 -m pip install --user --quiet pipenv; run pipenv sync; fi
          if [ -f requirements.txt ]; then found=1; run python3 -m pip install -r requirements.txt; fi
          if [ -f pyproject.toml ] && [ ! -f uv.lock ] && [ ! -f poetry.lock ]; then found=1; run python3 -m pip install -e .; fi
          if [ -f go.mod ]; then found=1; run go mod download; fi
          if [ -f Cargo.toml ]; then found=1; run cargo fetch; fi
          if [ -f Gemfile.lock ]; then found=1; run bundle install; fi
          if [ -f composer.lock ]; then found=1; run composer install --no-interaction; fi
          if ls *.sln >/dev/null 2>&1; then found=1; run dotnet restore; fi
          if [ "$failed" -ne 0 ]; then
            echo "::warning::Some dependency installs failed; the reviewer will be told tests may not run."
            exit 1
          fi
          if [ "$found" -eq 0 ]; then
            echo "PI_REVIEW_DEPS=none" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "PI_REVIEW_DEPS=installed" >> "$GITHUB_ENV"

      - name: Install pi
        run: |
          set -euo pipefail
          version=$(jq -er '.pi.version' "$PI_REVIEW_SETTINGS")
          npm install -g "@earendil-works/pi-coding-agent@$version"

      - name: Check out pi-review
        env:
          # The commit of this file, so the extension code and the YAML that
          # defined the job can never disagree. `job.workflow_sha` is the called
          # workflow's commit; `github.job_workflow_sha` does not exist, and
          # using it fails the whole workflow at startup.
          PI_REVIEW_SRC_REF: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          ref="${PI_REVIEW_SRC_REF:-main}"
          git init "$RUNNER_TEMP/pi-review-src"
          git -C "$RUNNER_TEMP/pi-review-src" remote add origin https://github.com/AutumnsGrove/pi-extensions.git
          if ! git -C "$RUNNER_TEMP/pi-review-src" fetch --depth 1 origin "$ref"; then
            echo "::warning::Could not fetch pi-review at $ref; falling back to main."
            ref=main
            git -C "$RUNNER_TEMP/pi-review-src" fetch --depth 1 origin "$ref"
          fi
          git -C "$RUNNER_TEMP/pi-review-src" checkout --detach FETCH_HEAD
          echo "pi-review source: $ref"

      # Everything below needs the caller's settings, and this is the first step
      # that holds a secret. The provider key is copied into the environment
      # under the name the project chose, so the review step can use it and the
      # install step above never could.
      - name: Read the settings
        env:
          PI_REVIEW_PROVIDER_KEY: ${{ secrets.PI_REVIEW_API_KEY }}
        run: |
          set -euo pipefail
          settings="$PI_REVIEW_SETTINGS"
          tools="read,grep,find,ls"
          if [ "$(jq -r '.tools.bash // false' "$settings")" = "true" ]; then
            tools="$tools,bash"
          fi
          tools="$tools,submit_review"
          if [ "$(jq -r '.review.resolveStaleThreads // false' "$settings")" = "true" ]; then
            tools="$tools,resolve_review_threads"
          fi
          {
            echo "PI_REVIEW_PROVIDER=$(jq -r '.provider // ""' "$settings")"
            echo "PI_REVIEW_MODEL=$(jq -r '.model // ""' "$settings")"
            echo "PI_REVIEW_THINKING=$(jq -r '.thinking // "high"' "$settings")"
            echo "PI_REVIEW_TOOLS=$tools"
            echo "PI_REVIEW_MAX_COMMENTS=$(jq -r '.review.maxInlineComments // 25' "$settings")"
            echo "PI_REVIEW_STRICTNESS=$(jq -r '.review.strictness // "significant"' "$settings")"
          } >> "$GITHUB_ENV"
          if [ "$(jq -r '.review.event // "COMMENT"' "$settings")" = "REQUEST_CHANGES" ]; then
            echo "PI_REVIEW_REQUEST_CHANGES=1" >> "$GITHUB_ENV"
          else
            echo "PI_REVIEW_REQUEST_CHANGES=0" >> "$GITHUB_ENV"
          fi
          if [ "$(jq -r '.review.resolveStaleThreads // false' "$settings")" = "true" ]; then
            echo "PI_REVIEW_RESOLVE_THREADS=1" >> "$GITHUB_ENV"
          else
            echo "PI_REVIEW_RESOLVE_THREADS=0" >> "$GITHUB_ENV"
          fi
          provider_env=$(jq -r '.providerEnv // ""' "$settings")
          if [ -n "$provider_env" ] && [ -n "${PI_REVIEW_PROVIDER_KEY:-}" ]; then
            echo "${provider_env}=${PI_REVIEW_PROVIDER_KEY}" >> "$GITHUB_ENV"
          fi

      - name: Mint the App token
        if: env.PI_REVIEW_APP_CONFIGURED == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PI_REVIEW_APP_ID }}
          private-key: ${{ secrets.PI_REVIEW_APP_PRIVATE_KEY }}

      - name: Review
        timeout-minutes: ${{ inputs.review-timeout-minutes }}
        env:
          PI_REVIEW_OUTPUT: ${{ runner.temp }}/pi-review/review.json
          PI_REVIEW: "1"
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PI_REVIEW_REQUEST: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PI_REVIEW_OUTPUT")"
          args=(
            -p
            --mode json
            --no-session
            -na
            -nc
            --offline
            -ne
            -e "$RUNNER_TEMP/pi-review-src/extensions/pi-review/index.ts"
            -ns
            -np
            --no-themes
            --no-mcp
            --tools "$PI_REVIEW_TOOLS"
          )
          if [ -n "$PI_REVIEW_PROVIDER" ]; then
            args+=(--provider "$PI_REVIEW_PROVIDER")
          fi
          if [ -n "$PI_REVIEW_MODEL" ]; then
            args+=(--model "$PI_REVIEW_MODEL")
          fi
          args+=(--thinking "$PI_REVIEW_THINKING")
          pi "${args[@]}" "Review pull request #$PR_NUMBER." \
            | tee "$RUNNER_TEMP/pi-review/events.jsonl"
          if [ ! -f "$PI_REVIEW_OUTPUT" ]; then
            echo "::error::pi-review wrote no review artifact"
            exit 1
          fi
          if grep -q '"incomplete": true' "$PI_REVIEW_OUTPUT"; then
            echo "::error::pi-review finished without submitting a review"
            exit 1
          fi

      - name: Step summary
        if: always()
        env:
          PI_REVIEW_OUTPUT: ${{ runner.temp }}/pi-review/review.json
        run: |
          {
            echo "## pi-review"
            echo
            if [ -f "$PI_REVIEW_OUTPUT" ]; then
              jq -r '"**" + (.review.event // "incomplete") + "** · inline comments: " + (((.review.comments // []) | length) | tostring) + (if .url then " · " + .url else "" end) + (if .error then " · error: " + .error else "" end)' "$PI_REVIEW_OUTPUT" || echo "Unreadable artifact."
            else
              echo "No review artifact: the review did not complete."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report an incomplete review
        if: failure()
        env:
          PI_REVIEW_OUTPUT: ${{ runner.temp }}/pi-review/review.json
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ -f "$PI_REVIEW_OUTPUT" ] && ! grep -q '"incomplete": true' "$PI_REVIEW_OUTPUT"; then
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --body "pi-review could not complete this review: the job failed or timed out. Fix the cause and re-run the workflow." || true
