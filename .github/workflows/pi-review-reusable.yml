name: pi-review

# The job body for every project that installs pi-review. Each project commits a
# small caller that points here at @main, so a fix in this file reaches every
# project without a commit there. The settings stay in the caller's
# `.github/pi-review.json` and are read at run time, so model, provider, tools,
# triggers and timeout remain local to each project.
#
# This file is the source, not generated. The caller is generated by
# `extensions/pi-review/workflow.ts` and checked by `pnpm pi-review:sync --check`.
#
# Runs from the caller's own event: `github.repository` is the caller, the
# checkout is the caller's PR, and the extension source is fetched at the commit
# of this file (`job.workflow_sha`) so the review runs the code that
# defined the job.

on:
  workflow_call:
    inputs:
      settings-path:
        description: Where the caller keeps its pi-review settings.
        type: string
        default: .github/pi-review.json
      review-timeout-minutes:
        description: Time allowed for the review step.
        type: number
        default: 20
      job-timeout-minutes:
        description: Time allowed for the whole job, review included.
        type: number
        default: 33
      install-dependencies:
        description: Install the caller's dependencies before reviewing.
        type: boolean
        default: true
      install-command:
        description: A custom install command, used instead of lockfile detection.
        type: string
        default: ""
    secrets:
      PI_REVIEW_API_KEY:
        required: false
      PI_REVIEW_APP_ID:
        required: false
      PI_REVIEW_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Pinned, not `ubuntu-latest`: the label migrates to Ubuntu 26 in
    # November 2026, and a reviewer should not change operating system under a
    # pull request because GitHub rotated a label.
    runs-on: ubuntu-26.04
    # Saving a cache is denied by default to low-trust triggers, and
    # `issue_comment` is one; the old `actions: write` route would have needed
    # every caller to grant the scope. A called workflow may now request cache
    # access itself when the caller does not cap it, so this reaches every
    # project without a caller change. Only same-repo PRs reach this job (the
    # caller's `if:` and the guard below), so a fork cannot write the cache.
    cache-mode: write
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    env:
      # A step's `if:` cannot read `secrets`, so the presence of both App secrets
      # is decided once here. Without it the mint step is unconditional, and a
      # repository with the App identity but no secrets fails before the review
      # step's `github.token` fallback can be reached.
      PI_REVIEW_APP_CONFIGURED: ${{ secrets.PI_REVIEW_APP_ID != '' && secrets.PI_REVIEW_APP_PRIVATE_KEY != '' }}
      PI_REVIEW_SETTINGS: ${{ inputs.settings-path }}
    steps:
      # The guard needs only `gh pr view`, so it runs before anything touches the
      # PR's tree: no checkout, no cache restore, no install. A mention on a fork
      # PR cannot execute that fork's install scripts or poison the dependency
      # cache that trusted runs restore (#33).
      - name: Require a same-repo pull request
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          # This step runs before the checkout (so a fork PR's code never runs),
          # which means `gh` cannot infer the repository from a working tree: it
          # must be named. Without `--repo` this failed with "not a git
          # repository" and every `@pi` mention died here.
          head=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRepository --jq '.headRepository.nameWithOwner')
          if [ "$head" != "${{ github.repository }}" ]; then
            echo "::error::pi-review only reviews pull requests from this repository"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check the settings file
        run: |
          set -euo pipefail
          if [ ! -f "$PI_REVIEW_SETTINGS" ]; then
            echo "::error::$PI_REVIEW_SETTINGS is missing; run /pi-review install in this repository"
            exit 1
          fi
          if ! jq -e . "$PI_REVIEW_SETTINGS" > /dev/null; then
            echo "::error::$PI_REVIEW_SETTINGS is not valid JSON"
            exit 1
          fi

      # The pi CLI and the package-manager download stores the install reads.
      # A cache saved by a `pull_request` run is scoped to that PR's merge ref,
      # so this pays off from the second review of a PR onwards, not the first.
      # The stores are content-addressed, so a stale entry is harmless; the pi
      # prefix is version-checked before use, which is why `restore-keys` can
      # fall back to the settings hash alone.
      - name: Restore pi and package caches
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/pi-review/pi
            ~/.npm/_cacache
            ~/.local/share/pnpm/store
            ~/.bun/install/cache
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-pi-review-${{ hashFiles('**/pi-review.json') }}-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json', '**/yarn.lock', '**/bun.lock', '**/bun.lockb', '**/uv.lock', '**/poetry.lock', '**/Pipfile.lock', '**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pi-review-${{ hashFiles('**/pi-review.json') }}-

      # No secret reaches this step. The install runs the caller's own scripts,
      # which is why it is bounded, kept away from keys, and its dependency
      # failures are warnings rather than failures.
      #
      # pi and the dependencies are network-bound and independent, so they run
      # at the same time instead of one after the other. A dependency failure
      # stays a warning (the review is told the tests may not run and reads the
      # code instead); a failed pi install is fatal, which is why this step no
      # longer uses `continue-on-error`.
      - name: Install pi and dependencies
        id: install
        timeout-minutes: 8
        env:
          PI_REVIEW_INSTALL_COMMAND: ${{ inputs.install-command }}
          PI_REVIEW_INSTALL_DEPS: ${{ inputs.install-dependencies }}
        run: |
          set -uo pipefail
          prefix="$RUNNER_TEMP/pi-review/pi"
          version=$(jq -er '.pi.version' "$PI_REVIEW_SETTINGS")
          pi_install=""
          if [ "$("$prefix/bin/pi" --version 2>/dev/null)" = "$version" ]; then
            echo "pi $version came from the cache"
          else
            npm install -g --prefix "$prefix" --no-audit --no-fund --loglevel=error \
              "@earendil-works/pi-coding-agent@$version" &
            pi_install=$!
          fi

          echo "PI_REVIEW_DEPS=unavailable" >> "$GITHUB_ENV"
          if [ "${PI_REVIEW_INSTALL_DEPS:-}" = "true" ]; then
            if [ -n "${PI_REVIEW_INSTALL_COMMAND:-}" ]; then
              if eval "$PI_REVIEW_INSTALL_COMMAND"; then
                echo "PI_REVIEW_DEPS=installed" >> "$GITHUB_ENV"
              else
                echo "::warning::The configured install command failed; the reviewer will be told tests may not run."
              fi
            else
              failed=0
              found=0
              run() { if ! "$@"; then failed=1; fi; }
              # Node managers are mutually exclusive: running two of them leaves
              # the tree from whichever ran last (npm ci deletes node_modules).
              if [ -f pnpm-lock.yaml ]; then
                found=1; run corepack pnpm install --frozen-lockfile --prefer-offline
              elif [ -f package-lock.json ]; then
                found=1; run npm ci --prefer-offline --no-audit --no-fund
              elif [ -f yarn.lock ]; then
                found=1
                if corepack yarn --version | grep -q '^1\.'; then
                  run corepack yarn install --frozen-lockfile
                else
                  run corepack yarn install --immutable
                fi
              elif [ -f bun.lock ] || [ -f bun.lockb ]; then
                found=1; run npm install -g bun; run bun install --frozen-lockfile
              fi
              if [ -f uv.lock ]; then
                found=1
                if ! command -v uv >/dev/null 2>&1; then curl -LsSf https://astral.sh/uv/install.sh | sh; export PATH="$HOME/.local/bin:$PATH"; fi
                run uv sync --frozen
              fi
              if [ -f poetry.lock ]; then found=1; run python3 -m pip install --user --quiet poetry; run poetry install --no-interaction; fi
              if [ -f Pipfile.lock ]; then found=1; run python3 -m pip install --user --quiet pipenv; run pipenv sync; fi
              if [ -f requirements.txt ]; then found=1; run python3 -m pip install -r requirements.txt; fi
              if [ -f pyproject.toml ] && [ ! -f uv.lock ] && [ ! -f poetry.lock ]; then found=1; run python3 -m pip install -e .; fi
              if [ -f go.mod ]; then found=1; run go mod download; fi
              if [ -f Cargo.toml ]; then found=1; run cargo fetch; fi
              if [ -f Gemfile.lock ]; then found=1; run bundle install; fi
              if [ -f composer.lock ]; then found=1; run composer install --no-interaction; fi
              if ls *.sln >/dev/null 2>&1; then found=1; run dotnet restore; fi
              if [ "$failed" -ne 0 ]; then
                echo "::warning::Some dependency installs failed; the reviewer will be told tests may not run."
              elif [ "$found" -eq 0 ]; then
                echo "PI_REVIEW_DEPS=none" >> "$GITHUB_ENV"
              else
                echo "PI_REVIEW_DEPS=installed" >> "$GITHUB_ENV"
              fi
            fi
          fi

          if [ -n "$pi_install" ] && ! wait "$pi_install"; then
            echo "::error::Could not install pi $version"
            exit 1
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Check out pi-review
        env:
          # The commit of this file, so the extension code and the YAML that
          # defined the job can never disagree. `job.workflow_sha` is the called
          # workflow's commit; `github.job_workflow_sha` does not exist, and
          # using it fails the whole workflow at startup.
          PI_REVIEW_SRC_REF: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          ref="${PI_REVIEW_SRC_REF:-main}"
          git init "$RUNNER_TEMP/pi-review-src"
          git -C "$RUNNER_TEMP/pi-review-src" remote add origin https://github.com/AutumnsGrove/pi-extensions.git
          if ! git -C "$RUNNER_TEMP/pi-review-src" fetch --depth 1 origin "$ref"; then
            echo "::warning::Could not fetch pi-review at $ref; falling back to main."
            ref=main
            git -C "$RUNNER_TEMP/pi-review-src" fetch --depth 1 origin "$ref"
          fi
          git -C "$RUNNER_TEMP/pi-review-src" checkout --detach FETCH_HEAD
          echo "pi-review source: $ref"

      # Everything below needs the caller's settings, and this is the first step
      # that holds a secret. The provider key is copied into the environment
      # under the name the project chose, so the review step can use it and the
      # install step above never could.
      #
      # This step also writes the only settings pi itself needs: a retry budget
      # patient enough for a 429 or an overloaded provider (#27). The agent
      # directory is a throwaway, so no user or project settings leak in.
      - name: Read the settings
        env:
          PI_REVIEW_PROVIDER_KEY: ${{ secrets.PI_REVIEW_API_KEY }}
        run: |
          set -euo pipefail
          settings="$PI_REVIEW_SETTINGS"
          tools="read,grep,find,ls"
          if [ "$(jq -r '.tools.bash // false' "$settings")" = "true" ]; then
            tools="$tools,bash"
          fi
          tools="$tools,submit_review"
          if [ "$(jq -r '.review.resolveStaleThreads // false' "$settings")" = "true" ]; then
            tools="$tools,resolve_review_threads"
          fi
          {
            echo "PI_REVIEW_PROVIDER=$(jq -r '.provider // ""' "$settings")"
            echo "PI_REVIEW_MODEL=$(jq -r '.model // ""' "$settings")"
            echo "PI_REVIEW_THINKING=$(jq -r '.thinking // "high"' "$settings")"
            echo "PI_REVIEW_TOOLS=$tools"
            echo "PI_REVIEW_MAX_COMMENTS=$(jq -r '.review.maxInlineComments // 25' "$settings")"
            echo "PI_REVIEW_STRICTNESS=$(jq -r '.review.strictness // "significant"' "$settings")"
            echo "PI_REVIEW_ON_PROVIDER_FAILURE=$(jq -r '.review.onProviderFailure // "fail"' "$settings")"
          } >> "$GITHUB_ENV"
          if [ "$(jq -r '.review.event // "COMMENT"' "$settings")" = "REQUEST_CHANGES" ]; then
            echo "PI_REVIEW_REQUEST_CHANGES=1" >> "$GITHUB_ENV"
          else
            echo "PI_REVIEW_REQUEST_CHANGES=0" >> "$GITHUB_ENV"
          fi
          if [ "$(jq -r '.review.resolveStaleThreads // false' "$settings")" = "true" ]; then
            echo "PI_REVIEW_RESOLVE_THREADS=1" >> "$GITHUB_ENV"
          else
            echo "PI_REVIEW_RESOLVE_THREADS=0" >> "$GITHUB_ENV"
          fi
          provider_env=$(jq -r '.providerEnv // ""' "$settings")
          if [ -n "$provider_env" ] && [ -n "${PI_REVIEW_PROVIDER_KEY:-}" ]; then
            echo "${provider_env}=${PI_REVIEW_PROVIDER_KEY}" >> "$GITHUB_ENV"
          fi

          agent_dir="$RUNNER_TEMP/pi-review/agent"
          mkdir -p "$agent_dir"
          jq '
            ((.review.retry? // {}) | if type == "object" then . else {} end) as $retry
            | {
                retry: {
                  enabled: true,
                  maxRetries: (if (($retry.maxRetries? | type) == "number") then $retry.maxRetries else 6 end),
                  baseDelayMs: (if (($retry.baseDelayMs? | type) == "number") then $retry.baseDelayMs else 5000 end),
                  maxAgentDelayMs: (if (($retry.maxDelayMs? | type) == "number") then $retry.maxDelayMs else 60000 end),
                  provider: {
                    maxRetries: (if (($retry.providerMaxRetries? | type) == "number") then $retry.providerMaxRetries else 2 end),
                    maxRetryDelayMs: 60000
                  }
                }
              }
          ' "$settings" > "$agent_dir/settings.json"
          jq -e . "$agent_dir/settings.json" > /dev/null

      # `client-id` is the v3 name for the same identity input; the secret keeps
      # its historical name and holds the client ID for a new install, or the
      # numeric App ID an older install stored (GitHub accepts either as the JWT
      # issuer). Re-running /pi-review install refreshes it to the client ID.
      - name: Mint the App token
        if: env.PI_REVIEW_APP_CONFIGURED == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PI_REVIEW_APP_ID }}
          private-key: ${{ secrets.PI_REVIEW_APP_PRIVATE_KEY }}
          # Narrow the installation token to exactly what a review uses. The
          # App manifest already requests these; naming them here fails loudly
          # if an App is ever installed with less, instead of a review that
          # cannot post.
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      # The step never decides the outcome. It records the exit code and the
      # shape of the stream, then the recovery and conclude steps decide, so a
      # timeout, a provider failure, and a prose ending are reported differently
      # and a recovered review can still post.
      - name: Review
        id: review
        timeout-minutes: ${{ inputs.review-timeout-minutes }}
        env:
          PI_REVIEW_OUTPUT: ${{ runner.temp }}/pi-review/review.json
          PI_REVIEW_EVENTS: ${{ runner.temp }}/pi-review/events.jsonl
          PI_REVIEW: "1"
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PI_REVIEW_REQUEST: ${{ github.event.comment.body }}
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-review/agent
        run: |
          set -uo pipefail
          work="$RUNNER_TEMP/pi-review"
          mkdir -p "$work"
          # Metadata is diagnostic; never let it stop the review.
          if ! jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg pr "$PR_NUMBER" \
            --arg provider "$PI_REVIEW_PROVIDER" \
            --arg model "$PI_REVIEW_MODEL" \
            --arg thinking "$PI_REVIEW_THINKING" \
            --arg tools "$PI_REVIEW_TOOLS" \
            --arg workflowSha "${{ job.workflow_sha }}" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg startedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile agent "$PI_CODING_AGENT_DIR/settings.json" \
            '{repo:$repo, pullRequest:($pr|tonumber? // $pr), provider:$provider, model:$model, thinking:$thinking, tools:($tools|split(",")), retry:($agent[0].retry // {}), workflowSha:$workflowSha, event:$event, startedAt:$startedAt}' \
            > "$work/run-meta.json"; then
            echo "::warning::Could not write the run metadata."
            echo '{"note":"run metadata unavailable"}' > "$work/run-meta.json"
          fi

          args=(
            -p
            --mode json
            --no-session
            -na
            -nc
            --offline
            -ne
            -e "$RUNNER_TEMP/pi-review-src/extensions/pi-review/index.ts"
            -ns
            -np
            --no-themes
            --no-mcp
            --tools "$PI_REVIEW_TOOLS"
          )
          if [ -n "$PI_REVIEW_PROVIDER" ]; then
            args+=(--provider "$PI_REVIEW_PROVIDER")
          fi
          if [ -n "$PI_REVIEW_MODEL" ]; then
            args+=(--model "$PI_REVIEW_MODEL")
          fi
          args+=(--thinking "$PI_REVIEW_THINKING")

          set +e
          pi "${args[@]}" "Review pull request #$PR_NUMBER." | tee "$PI_REVIEW_EVENTS"
          status=${PIPESTATUS[0]}
          echo "PI_PI_EXIT=$status" >> "$GITHUB_ENV"

          last_event=$(tail -n 1 "$PI_REVIEW_EVENTS" 2>/dev/null | jq -r '.type // "unknown"' 2>/dev/null || true)
          last_stop=$(jq -Rrs '
            split("\n")
            | map(select(length > 0) | (fromjson? // empty))
            | map(select(.type == "message_end" and .message.role == "assistant") | .message)
            | last // {}
            | (.stopReason // "none")
          ' "$PI_REVIEW_EVENTS" 2>/dev/null || true)
          last_error=$(jq -Rrs '
            split("\n")
            | map(select(length > 0) | (fromjson? // empty))
            | map(select(.type == "message_end" and .message.role == "assistant") | .message)
            | last // {}
            | (.errorMessage // "")
          ' "$PI_REVIEW_EVENTS" 2>/dev/null | tr '\n' ' ' | cut -c1-500 || true)
          if jq --argjson exit "$status" \
            --arg lastEvent "$last_event" \
            --arg lastStopReason "$last_stop" \
            --arg lastError "$last_error" \
            '. + {piExit:$exit, lastEvent:$lastEvent, lastStopReason:$lastStopReason, lastError:$lastError}' \
            "$work/run-meta.json" > "$work/run-meta.next"; then
            mv "$work/run-meta.next" "$work/run-meta.json"
          else
            echo "::warning::Could not append the run metadata."
            rm -f "$work/run-meta.next"
          fi
          exit 0

      # The extension already recovers a substantive prose answer in
      # `agent_settled`. This is the safety net for a timeout, a killed process,
      # or a post GitHub rejected: retry the validated review, then the final
      # assistant text, and record exactly what happened (#43).
      - name: Recover the review
        if: always()
        env:
          PI_REVIEW_OUTPUT: ${{ runner.temp }}/pi-review/review.json
          PI_REVIEW_EVENTS: ${{ runner.temp }}/pi-review/events.jsonl
          PI_REVIEW_RECOVERY: ${{ runner.temp }}/pi-review/recovery.json
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -uo pipefail
          work="$RUNNER_TEMP/pi-review"
          artifact="$PI_REVIEW_OUTPUT"
          events="$PI_REVIEW_EVENTS"
          recovery="$PI_REVIEW_RECOVERY"
          mkdir -p "$work"

          write_recovery() { # recovered url reason [detail]
            jq -n --argjson recovered "$1" --arg url "$2" --arg reason "$3" --arg detail "${4:-}" \
              '{recovered:$recovered, url:$url, reason:$reason, detail:$detail}' > "$recovery"
          }
          post_review() { # payload-file
            gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
              --input "$1" --jq '.html_url' 2> "$work/recovery-error.txt"
          }

          # A normal submission needs no recovery. Validate first: a truncated
          # artifact is a crash, not a posted review.
          if [ -f "$artifact" ] && jq -e . "$artifact" > /dev/null 2>&1 && \
            [ "$(jq -r '.incomplete // false' "$artifact")" != "true" ]; then
            write_recovery false "" "review posted" ""
            exit 0
          fi

          # The extension posted a recovered review before the process settled.
          if [ -f "$artifact" ]; then
            url=$(jq -r '.url // ""' "$artifact")
            if [ -n "$url" ]; then
              write_recovery true "$url" "review posted" ""
              exit 0
            fi
          fi

          # A validated review that never reached GitHub (a rejected post, a
          # timeout after submit_review) is the best thing to retry.
          if [ -f "$artifact" ] && jq -e '.review != null' "$artifact" > /dev/null 2>&1; then
            jq '{event: (.review.event // "COMMENT"), body: (((.review.summary // "") | if length > 0 then . + "\n\n" else "" end) + "<!-- pi-review:review -->"), comments: [(.review.comments // [])[] | {path, line, side: (.side // "RIGHT"), body} + (if .start_line then {start_line} else {} end)]}' \
              "$artifact" > "$work/recovery-full.json"
            if url=$(post_review "$work/recovery-full.json") && [ -n "$url" ]; then
              write_recovery true "$url" "posted the validated review" ""
              exit 0
            fi
            # Inline anchors are the most likely reason GitHub rejects the whole
            # review; the summary is still useful on its own.
            summary=$(jq -r '.review.summary // ""' "$artifact")
            if [ "${#summary}" -ge 40 ]; then
              jq '{event: "COMMENT", body: ((.review.summary // "") + "\n\n<!-- pi-review:review -->"), comments: []}' \
                "$artifact" > "$work/recovery-summary.json"
              if url=$(post_review "$work/recovery-summary.json") && [ -n "$url" ]; then
                write_recovery true "$url" "posted the review summary" ""
                exit 0
              fi
            fi
          fi

          # A provider error, abort, or output limit is not a prose review. Do
          # not turn one into a comment (#27).
          artifact_kind=""
          if [ -f "$artifact" ]; then
            artifact_kind=$(jq -r '.errorKind // ""' "$artifact")
          fi
          case "$artifact_kind" in
            provider|aborted|budget)
              write_recovery false "" "not recoverable: $artifact_kind" ""
              exit 0
              ;;
          esac

          # The model ended in prose. Recover the last assistant text if it is
          # substantive enough to stand on its own (#43).
          text=""
          if [ -f "$events" ]; then
            text=$(jq -Rrs '
              split("\n")
              | map(select(length > 0) | (fromjson? // empty))
              | map(select(.type == "message_end" and .message.role == "assistant") | .message)
              | map(select((.stopReason // "") == "stop")
                  | [.content[]? | select(.type == "text") | .text] | join("\n"))
              | map(select(length >= 400))
              | last // ""
            ' "$events" 2>/dev/null || true)
          fi
          if [ "${#text}" -ge 400 ]; then
            jq -n --arg text "$text" '{event: "COMMENT", body: ("<!-- pi-review:review -->\n_Submitted by recovery: the run ended without calling `submit_review`, so pi-review posted its final answer as a COMMENT review._\n\n" + $text), comments: []}' \
              > "$work/recovery-text.json"
            if url=$(post_review "$work/recovery-text.json") && [ -n "$url" ]; then
              write_recovery true "$url" "posted the final assistant text" ""
              exit 0
            fi
          fi

          detail=""
          if [ -f "$work/recovery-error.txt" ]; then
            detail=$(tr '\n' ' ' < "$work/recovery-error.txt" | cut -c1-400)
          fi
          write_recovery false "" "nothing to recover" "$detail"
          exit 0

      # The one place the run succeeds or fails. A provider outage can be a red
      # check (default) or a warning depending on `review.onProviderFailure`; a
      # recovered review is a warning because a review did post. Everything else
      # is a failure and gets the in-place comment below.
      - name: Conclude the review
        if: always()
        env:
          PI_REVIEW_OUTPUT: ${{ runner.temp }}/pi-review/review.json
          PI_REVIEW_RECOVERY: ${{ runner.temp }}/pi-review/recovery.json
          PI_REVIEW_CONCLUSION: ${{ runner.temp }}/pi-review/conclusion.json
        run: |
          set -uo pipefail
          artifact="$PI_REVIEW_OUTPUT"
          recovery="$PI_REVIEW_RECOVERY"
          conclusion="$PI_REVIEW_CONCLUSION"
          kind=""
          detail=""
          url=""
          retryable=false
          outcome=""
          reason=""

          if [ -f "$artifact" ]; then
            if ! jq -e . "$artifact" > /dev/null 2>&1; then
              outcome="failure"
              kind="unreadable"
              detail="the review artifact was not valid JSON"
            else
              incomplete=$(jq -r '.incomplete // false' "$artifact")
              kind=$(jq -r '.errorKind // ""' "$artifact")
              detail=$(jq -r '.error // ""' "$artifact")
              url=$(jq -r '.url // ""' "$artifact")
              retryable=$(jq -r '.retryable // false' "$artifact")
              if [ "$incomplete" != "true" ]; then
                outcome="success"
                kind="submitted"
                reason="review posted"
              elif [ "$(jq -r '.recovered // false' "$artifact")" = "true" ] && [ -z "$url" ]; then
                # The prose review was recovered but the post never landed; name
                # that instead of claiming there was nothing to post.
                kind="post"
                detail="the recovered review was not posted"
              fi
            fi
          fi

          # A recovery that posted wins over a failed or unreadable artifact; it
          # must never override a normal submission.
          if [ "$outcome" != "success" ] && [ -f "$recovery" ] && \
            [ "$(jq -r '.recovered // false' "$recovery")" = "true" ]; then
            outcome="recovered"
            kind="recovered"
            reason=$(jq -r '.reason // "the review was recovered"' "$recovery")
            url=$(jq -r '.url // ""' "$recovery")
          fi

          if [ -z "$outcome" ] && [ -n "$url" ]; then
            outcome="recovered"
            kind="recovered"
            reason="review posted"
          fi

          if [ -z "$outcome" ] && [ -z "$kind" ]; then
            if [ -f "$artifact" ]; then
              kind="incomplete"
              detail="the run ended without calling submit_review"
            else
              kind="no-artifact"
              detail="no review artifact was written; the review step may have timed out or crashed"
            fi
          fi

          if [ -z "$outcome" ] && [ "$kind" = "provider" ]; then
            mode="${PI_REVIEW_ON_PROVIDER_FAILURE:-fail}"
            if [ "$mode" = "warn" ]; then
              outcome="provider-warn"
            else
              outcome="failure"
            fi
          fi
          if [ -z "$outcome" ]; then outcome="failure"; fi

          if [ -z "$reason" ]; then
            case "$kind" in
              provider)
                if [ "$retryable" = "true" ]; then
                  reason="the model provider was unavailable after retries, so no review was posted"
                else
                  reason="the model provider rejected the request, so no review was posted"
                fi
                ;;
              incomplete) reason="the review agent ended without calling submit_review and left nothing substantial to post" ;;
              aborted) reason="the review run was cancelled or timed out" ;;
              budget) reason="the review hit the model's output limit before it could submit" ;;
              post) reason="the review was validated but GitHub rejected the post" ;;
              no-artifact) reason="the review step produced no artifact; it may have timed out or crashed" ;;
              unreadable) reason="the review artifact was not valid JSON, so the outcome could not be read" ;;
              recovered) reason="the run ended without calling submit_review; its final answer was posted as a COMMENT review" ;;
              *) reason="the review did not complete" ;;
            esac
          fi
          detail=$(printf '%s' "$detail" | tr '\n' ' ' | cut -c1-500 | sed 's/[[:space:]]*$//')

          jq -n --arg outcome "$outcome" --arg kind "$kind" --arg reason "$reason" \
            --arg detail "$detail" --arg url "$url" --argjson retryable "$retryable" \
            '{outcome:$outcome, kind:$kind, reason:$reason, detail:$detail, url:$url, retryable:$retryable}' \
            > "$conclusion"

          {
            echo "## pi-review"
            echo
            if [ -f "$artifact" ] && jq -e '.review != null' "$artifact" > /dev/null 2>&1; then
              jq -r '"**" + (.review.event // "incomplete") + "** · inline comments: " + (((.review.comments // []) | length) | tostring) + (if .url then " · " + .url else "" end)' "$artifact"
            else
              echo "No review was posted."
            fi
            echo
            echo "- outcome: \`$outcome\`"
            echo "- reason: \`$kind\` — $reason"
            if [ -n "$detail" ]; then echo "- detail: \`$detail\`"; fi
            if [ -n "$url" ]; then echo "- review: $url"; fi
            echo "- pi exit: \`${PI_PI_EXIT:-unknown}\`"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

          case "$outcome" in
            success) exit 0 ;;
            recovered) echo "::warning::pi-review recovered the review: $reason"; exit 0 ;;
            provider-warn) echo "::warning::pi-review could not post a review: $reason"; exit 0 ;;
            *) echo "::error::pi-review could not post a review: $reason"; exit 1 ;;
          esac

      # One failure comment per pull request, edited in place. This uses
      # `github.token` deliberately: a comment can only be edited by the identity
      # that wrote it, and the workflow token is always present. Reviews still
      # post as the App, but workflow failures are the workflow's voice (#46).
      #
      # A cancelled run is not a failure: a newer push cancels the previous
      # review on purpose, and the superseded run has no artifact to report. The
      # comment is also cleared on success, so a stale "could not complete" does
      # not outlive the failure it described.
      - name: Report or clear an incomplete review
        if: always() && !cancelled()
        env:
          PI_REVIEW_CONCLUSION: ${{ runner.temp }}/pi-review/conclusion.json
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -uo pipefail
          conclusion="$PI_REVIEW_CONCLUSION"
          [ -f "$conclusion" ] || exit 0
          [ -n "${PR_NUMBER:-}" ] || exit 0
          outcome=$(jq -r '.outcome // "failure"' "$conclusion")
          failure_comment=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- pi-review:failed -->")) | .id' \
            2>/dev/null | tail -n 1 || true)
          case "$outcome" in
            success|recovered)
              if [ -n "$failure_comment" ]; then
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$failure_comment" > /dev/null 2>&1 \
                  || echo "::warning::Could not clear the pi-review failure comment."
              fi
              exit 0 ;;
          esac
          reason=$(jq -r '.reason // "the review did not complete"' "$conclusion")
          kind=$(jq -r '.kind // "unknown"' "$conclusion")
          detail=$(jq -r '.detail // ""' "$conclusion" | tr '\n' ' ' | tr '`' "'" | cut -c1-400 | sed 's/[[:space:]]*$//')
          body=$(printf '%s\n' \
            "<!-- pi-review:failed -->" \
            "**pi-review could not complete this review:** ${reason}." \
            "" \
            "- run: [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" \
            "- when: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "- reason: \`${kind}\`")
          if [ -n "$detail" ]; then
            body="${body}"$'\n'"- detail: \`${detail}\`"
          fi
          body="${body}"$'\n\n'"Fix the cause and re-run the workflow. This comment is updated in place, not duplicated."
          jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/pi-review/comment.json"
          if [ -n "$failure_comment" ]; then
            if gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$failure_comment" \
              --input "$RUNNER_TEMP/pi-review/comment.json" > /dev/null 2>&1; then
              exit 0
            fi
            echo "::warning::Could not edit the existing pi-review failure comment; posting a new one."
          fi
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --input "$RUNNER_TEMP/pi-review/comment.json" > /dev/null 2>&1; then
            echo "::warning::Could not post the pi-review failure comment."
          fi

      # Keep the transcript and the resolved model/tool/retry/end state with the
      # run, not just in the log (#45). `events.jsonl` is already redacted by
      # construction: it is the model stream, and the provider key lives only in
      # the environment.
      - name: Upload the review transcript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pi-review-pr-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pi-review/events.jsonl
            ${{ runner.temp }}/pi-review/review.json
            ${{ runner.temp }}/pi-review/recovery.json
            ${{ runner.temp }}/pi-review/conclusion.json
            ${{ runner.temp }}/pi-review/run-meta.json
          if-no-files-found: warn
          retention-days: 7
