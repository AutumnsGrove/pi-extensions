# Generated by pi-review from .github/pi-review.json
# Edit the settings file, not this workflow.
name: pi-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: pi-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pi
        run: npm install -g @earendil-works/pi-coding-agent@1.5.0
      - name: Check out pi-review
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/pi-review-src"
          git -C "$RUNNER_TEMP/pi-review-src" remote add origin https://github.com/AutumnsGrove/pi-extensions.git
          git -C "$RUNNER_TEMP/pi-review-src" fetch --depth 1 origin '186b868564bd0cf174528da2e55a0bdc4624c38e'
          git -C "$RUNNER_TEMP/pi-review-src" checkout --detach FETCH_HEAD
      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PI_REVIEW_APP_ID }}
          private-key: ${{ secrets.PI_REVIEW_APP_PRIVATE_KEY }}
      - name: Review
        timeout-minutes: 20
        env:
          PI_REVIEW: "1"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          OPENCODE_API_KEY: ${{ secrets.PI_REVIEW_API_KEY }}
          PI_REVIEW_OUTPUT: ${{ runner.temp }}/pi-review/review.json
          PI_REVIEW_MAX_COMMENTS: "25"
          PI_REVIEW_REQUEST_CHANGES: "0"
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PI_REVIEW_OUTPUT")"
          pi \
            -p \
            --mode json \
            --no-session \
            -na \
            -nc \
            --offline \
            -ne \
            -e "$RUNNER_TEMP/pi-review-src/extensions/pi-review/index.ts" \
            -ns \
            -np \
            --no-themes \
            --no-mcp \
            --tools read,grep,find,ls,bash,submit_review \
            --provider opencode-go \
            --model deepseek-v4.1-flash \
            --thinking medium \
            "Review pull request #$PR_NUMBER." \
            | tee "$RUNNER_TEMP/pi-review/events.jsonl"
          if [ ! -f "$PI_REVIEW_OUTPUT" ]; then
            echo "::error::pi-review wrote no review artifact"
            exit 1
          fi
          if grep -q '"incomplete": true' "$PI_REVIEW_OUTPUT"; then
            echo "::error::pi-review finished without submitting a review"
            exit 1
          fi
      - name: Step summary
        if: always()
        env:
          PI_REVIEW_OUTPUT: ${{ runner.temp }}/pi-review/review.json
        run: |
          {
            echo "## pi-review"
            echo
            if [ -f "$PI_REVIEW_OUTPUT" ]; then
              jq -r '"**" + (.review.event // "incomplete") + "** · inline comments: " + (((.review.comments // []) | length) | tostring) + (if .url then " · " + .url else "" end) + (if .error then " · error: " + .error else "" end)' "$PI_REVIEW_OUTPUT" || echo "Unreadable artifact."
            else
              echo "No review artifact: the review did not complete."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report an incomplete review
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PI_REVIEW_OUTPUT: ${{ runner.temp }}/pi-review/review.json
        run: |
          if [ -f "$PI_REVIEW_OUTPUT" ] && ! grep -q '"incomplete": true' "$PI_REVIEW_OUTPUT"; then
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --body "pi-review could not complete this review: the job failed or timed out. Fix the cause and re-run the workflow." || true
